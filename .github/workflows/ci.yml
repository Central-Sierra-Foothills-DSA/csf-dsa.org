# Makes sure main and every pull request still build.
#
# Deployment is not wired up yet. When it is, add a deploy job here (GitHub
# Pages, Cloudflare Pages, Netlify, or an S3 sync) plus a daily `schedule`
# trigger so the events list, which is fetched at build time, stays fresh.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
