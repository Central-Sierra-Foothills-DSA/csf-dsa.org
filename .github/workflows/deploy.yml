# Builds the site and deploys it to GitHub Pages.
#
# Runs on every push to main, once a day (so the events list stays fresh,
# since events are fetched from Solidarity Tech at build time), and on demand.
#
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
# To deploy somewhere else (S3, Netlify, Cloudflare), replace the deploy job.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 14 * * *' # daily, 7 AM Pacific (6 AM PST)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Uncomment these if the site is served from a project path
          # (https://<org>.github.io/csf-dsa.org/) rather than a custom domain.
          # BASE_PATH: /csf-dsa.org
          # SITE_URL: https://central-sierra-foothills-dsa.github.io
          SITE_URL: https://csf-dsa.org
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
